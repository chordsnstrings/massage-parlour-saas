packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - sharp
# F25: CI runs `pnpm audit --prod --audit-level=high` (fails on high/critical). To accept an advisory that cannot be
# fixed yet, add its GHSA id below with a comment: why it does not apply or what blocks the fix, and a review date.
# Remove the entry once a fixed version is in. Example:  - GHSA-xxxx-xxxx-xxxx # reason; review 2026-12-01
auditConfig:
  ignoreGhsas: []
# 2026-10-31 audit: transitive fixes. happy-dom is only a declared dependency of @puckeditor/core (its dist never
# imports it), so the 21.x major is safe; body-parser comes via @modelcontextprotocol/sdk > express.
overrides:
  happy-dom: ^21.0.4
  body-parser: ^2.4.0
