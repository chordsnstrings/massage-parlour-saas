# Single-droplet production stack (docs/PLAN.md §3): Postgres, migrations, web, worker and Caddy (HTTPS).
# Images are built on the droplet from the checked-out branch; /usr/local/bin/spa-update keeps it current.
# Secrets live in /opt/spa/.env (written at first boot by cloud-init.sh). Run from this directory with
#   docker compose --env-file /opt/spa/.env <command>
name: spa

x-app-env: &app-env
  NODE_ENV: production
  ROOT_DOMAIN: ${SITE_HOST}
  # Host routing (ROUTING=host): set APP_URL=https://app.<domain> and ADMIN_URL=https://admin.<domain> in the overlay.
  APP_URL: ${APP_URL:-https://${SITE_HOST}}
  ADMIN_URL: ${ADMIN_URL:-https://${SITE_HOST}/admin}
  # More platform domains (comma or space separated) — each serves the whole platform with its own links + TLS.
  EXTRA_ROOT_DOMAINS: ${EXTRA_ROOT_DOMAINS:-}
  # Owner, 2026-10-09: the droplet's base value (ahmed@arks.ae) + two more super-admins, appended here because the base
  # env can't be edited without SSH. listedAdminEmails() drops empty segments and duplicates. Keep in sync with migrate.
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-},ahmedabouseif1997@gmail.com,sefohh.aa45@gmail.com
  # Studio Ask AI + Claude MCP connector (/api/mcp): only these super-admins (verified email + 2FA). Owner, 2026-10-09:
  # exactly the two added admins by default; a value in /opt/spa/.env or the secrets overlay replaces it.
  SITE_AI_EDITOR_EMAILS: ${SITE_AI_EDITOR_EMAILS:-ahmedabouseif1997@gmail.com,sefohh.aa45@gmail.com}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  ARK_API_KEY: ${ARK_API_KEY:-}
  ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  CF_API_TOKEN: ${CF_API_TOKEN:-}
  CF_ZONE_ID: ${CF_ZONE_ID:-}
  CF_CNAME_TARGET: ${CF_CNAME_TARGET:-}
  NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}
  NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}
  NAMECHEAP_CLIENT_IP: ${NAMECHEAP_CLIENT_IP:-}
  NAMECHEAP_USERNAME: ${NAMECHEAP_USERNAME:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-auto}
  # Off-site DB backups + restore drill (worker). Unset → the worker falls back to the S3_* bucket (backups/ prefix);
  # a separate private bucket with its own key is recommended.
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # F9 bot check (Cloudflare Turnstile) on online booking, the widget, Apply and Contact; unset = off (console flags it).
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_CUSTOM_DOMAINS: ${TURNSTILE_CUSTOM_DOMAINS:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-spamanagement.ae <no-reply@spamanagement.ae>} # B1: .ae until .co is verified in Resend
  APP_RELEASE: ${APP_RELEASE:-}

# G8: rotate container logs (applies on the next `up`, independent of /etc/docker/daemon.json).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-db: &db
  DATABASE_URL_OWNER: postgres://spa_owner:${SPA_OWNER_PASSWORD}@postgres:5432/spa
  DATABASE_URL_PLATFORM: postgres://spa_platform:${SPA_PLATFORM_PASSWORD}@postgres:5432/spa
  DATABASE_URL_APP: postgres://spa_app:${SPA_APP_PASSWORD}@postgres:5432/spa

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SPA_OWNER_PASSWORD: ${SPA_OWNER_PASSWORD}
      SPA_PLATFORM_PASSWORD: ${SPA_PLATFORM_PASSWORD}
      SPA_APP_PASSWORD: ${SPA_APP_PASSWORD}
    command: >-
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=8MB
      -c maintenance_work_mem=128MB -c max_connections=60
      -c shared_preload_libraries=pg_stat_statements -c log_min_duration_statement=500
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../packages/db/sql/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - /opt/spa/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spa"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1200m

  migrate:
    logging: *logging
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    image: spa-worker:local
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    environment:
      <<: *db
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-},ahmedabouseif1997@gmail.com,sefohh.aa45@gmail.com
      # G7: migrations give up instead of queueing traffic behind a lock (packages/db/src/migrate.ts).
      MIGRATE_LOCK_TIMEOUT: ${MIGRATE_LOCK_TIMEOUT:-10s}
      MIGRATE_STATEMENT_TIMEOUT: ${MIGRATE_STATEMENT_TIMEOUT:-15min}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    logging: *logging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_ROUTING: "${ROUTING:-path}" }
    image: spa-web:local
    restart: unless-stopped
    environment:
      <<: [*app-env, *db]
      DB_POOL_MAX: "10"
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 1200m

  worker:
    logging: *logging
    build: { context: ../.., dockerfile: apps/worker/Dockerfile }
    image: spa-worker:local
    restart: unless-stopped
    environment:
      <<: [*app-env, *db]
      DB_POOL_MAX: "4"
      # Monthly restore drill: creates/drops a scratch database (needs CREATEDB; spa_owner has none).
      RESTORE_DRILL_ADMIN_URL: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres
      # G8: the heartbeat reports the updater's deploy state (deploy.json) to the console + alerts.
      OPS_STATUS_DIR: /ops-status
    volumes:
      - /opt/spa/status:/ops-status:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    # The heartbeat job (every 5 min) touches this file; unhealthy shows in /_status/runtime.txt.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker-heartbeat -mmin -15 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      start_period: 3m
      retries: 3
    mem_limit: 512m

  # Keeps /usr/local/bin/spa-update in step with deploy/droplet/update.sh on every deploy (no SSH needed when the
  # updater changes). Atomic rename, so a running updater keeps its old copy.
  updater-sync:
    image: alpine:3.20
    logging: *logging
    restart: "no"
    volumes:
      - ./update.sh:/src/update.sh:ro
      - /usr/local/bin:/host-bin
    command:
      - sh
      - -c
      - cmp -s /src/update.sh /host-bin/spa-update || { cp /src/update.sh /host-bin/.spa-update.new && chmod 755 /host-bin/.spa-update.new && mv /host-bin/.spa-update.new /host-bin/spa-update; }

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: ${SITE_HOST}
      ACME_EMAIL: ${ACME_EMAIL:-}
      STATUS_USER: ${STATUS_USER:-ops}
      STATUS_HASH: ${STATUS_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/spa/status:/srv/_status:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    mem_limit: 256m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
