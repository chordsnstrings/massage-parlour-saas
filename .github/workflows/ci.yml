name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap test database
        run: >-
          psql -h localhost -U postgres -d postgres -v db_name=spa_test
          -v owner_password=spa_owner_dev -v platform_password=spa_platform_dev -v app_password=spa_app_dev
          -f packages/db/sql/bootstrap.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @spa/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @spa/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @spa/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
          retention-days: 7
