name: CI

on:
  pull_request:
  push:
    # The droplet deploys claude/intelligent-heisenberg-g9e81o: every push there must be checked too.
    branches: [main, claude/intelligent-heisenberg-g9e81o]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap test database
        run: >-
          psql -h localhost -U postgres -d postgres -v db_name=spa_test
          -v owner_password=spa_owner_dev -v platform_password=spa_platform_dev -v app_password=spa_app_dev
          -v drill_password=spa_drill_dev
          -f packages/db/sql/bootstrap.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @spa/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @spa/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @spa/web e2e
        env:
          # Against the build above: the dev server's on-demand compiles ran the runner out of memory.
          E2E_SERVER: start
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
          retention-days: 7

  # F25 + F26: quick guards without a database, in parallel with `check` (no extra wall time).
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema drift (pnpm db:generate must have nothing to write)
        run: pnpm db:check-drift
      - name: Migration journal guard
        run: pnpm --filter @spa/db exec vitest run test/migrate.test.ts -t 'migration journal|skippedMigrations'
      - name: Dependency audit (production, high + critical)
        # Accepted advisories go in pnpm-workspace.yaml `auditConfig.ignoreGhsas` (one line each: why + review date).
        run: pnpm audit --prod --audit-level=high
      - name: Caddyfile client-IP handling (validate + forged-header checks)
        run: bash deploy/droplet/test-caddy-ip.sh

  # G7: the droplet deploys `deploy/green`, never the raw branch tip. Only a commit of the deploy branch whose checks
  # passed moves it (forward only; the built-in token, no extra secret). Pushes made with it start no workflow.
  promote:
    needs: [check, guards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/intelligent-heisenberg-g9e81o'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move deploy/green to this commit
        run: |
          set -eu
          if git fetch -q origin deploy/green 2>/dev/null; then
            cur=$(git rev-parse FETCH_HEAD)
            # A slower run of an older commit must not move it back.
            if git merge-base --is-ancestor "$GITHUB_SHA" "$cur"; then
              echo "deploy/green is already at ${cur} (contains ${GITHUB_SHA}); leaving it"
              exit 0
            fi
          fi
          git push --force origin "${GITHUB_SHA}:refs/heads/deploy/green"
          echo "deploy/green -> ${GITHUB_SHA}"
