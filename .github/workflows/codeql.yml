name: CodeQL

# F25: static security analysis (security-extended queries) of the TypeScript/JavaScript code. Findings appear under
# the repository's Security → Code scanning tab; a private repository needs GitHub Code Security enabled for it.
on:
  push:
    branches: [claude/intelligent-heisenberg-g9e81o]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC: new queries also run against unchanged code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - docs
              - "**/drizzle"
              - "**/test"
              - "**/*.test.ts"
              - apps/web/e2e
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
