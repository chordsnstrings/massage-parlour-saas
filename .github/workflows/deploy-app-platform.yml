name: Deploy (App Platform)

# Rebuilds the DigitalOcean App Platform app after CI passes on main.
# Needs repository secret DIGITALOCEAN_ACCESS_TOKEN and variable DO_APP_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-app-platform
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DO_APP_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          APP_ID: ${{ vars.DO_APP_ID }}
        run: bash scripts/do-deploy.sh
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 10 "${{ vars.DO_APP_URL }}/api/health"
