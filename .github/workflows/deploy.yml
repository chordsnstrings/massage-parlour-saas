name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (a commit SHA) — use for rollbacks
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spa-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/spa-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    # Runs after images (push) or alone (manual rollback). Disabled until the droplet exists: set repo variable DEPLOY_ENABLED=true.
    if: always() && vars.DEPLOY_ENABLED == 'true' && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ github.event.inputs.tag || github.sha }}
      HOST: ${{ secrets.DROPLET_HOST }}
      DEPLOY_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Upload stack files
        run: rsync -az deploy/docker-compose.yml deploy/postgres packages/db/sql/bootstrap.sql "$DEPLOY_USER@$HOST:/opt/spa/"
      - name: Roll out
        run: |
          ssh "$DEPLOY_USER@$HOST" "set -e; cd /opt/spa
            sed -i 's/^TAG=.*/TAG=$TAG/' .env
            docker compose pull --quiet
            docker compose up -d --remove-orphans --wait
            docker image prune -f"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "https://app.${{ vars.ROOT_DOMAIN || 'spamanagement.ae' }}/api/health"
