<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be Relax — Spa Management CRM</title>
<meta name="description" content="Be Relax Spa & Massage Center, Abu Dhabi — bookings, clients, accounts, VAT, payroll, marketing and website, all in one dashboard.">
<meta name="theme-color" content="#E7ECFB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:ital@0;1&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Pipeline theme — clean light, blue accent ===== */
:root{
  --bg:#E7ECFB;--bg2:#F4F6FD;--surface:#FFFFFF;--surface2:#F6F8FD;--text:#1A1F2E;--muted:#737C8C;
  --accent:#3B6FE0;--accent-ink:#2F5FD0;--on-accent:#FFFFFF;
  --accent-grad:linear-gradient(135deg,#4C84F2,#3156D6);
  --line:rgba(26,31,46,.08);--line2:rgba(26,31,46,.13);--glow:rgba(59,111,224,.18);
  --tint1:#9DB8F2;--tint2:#DCE6FB;--tint3:#6E8FEC;
  --ok:#1FA865;--ok-bg:rgba(31,168,101,.12);--warn:#C98A12;--warn-bg:rgba(245,184,46,.18);
  --bad:#E0552F;--bad-bg:rgba(242,96,60,.14);--info:#3B6FE0;--info-bg:rgba(59,111,224,.12);
  --blue:#3B6FE0;--amber:#F5B82E;--orange:#F2603C;--green:#28C877;
  --head:"Inter",sans-serif;--serif:"Inter",sans-serif;--font:"Inter",sans-serif;--rp:14px;
  --radius:16px;--radius-sm:10px;--side:248px;
  /* legacy glass tokens pointed at solid values so old rules render flat */
  --glass:#FFFFFF;--glass2:#F6F8FD;--glass-brd:var(--line);--hl:transparent;--blur:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
h1,h2,h3,h4,.logo,.disp{font-family:var(--head);font-weight:700;letter-spacing:-.012em}
.bname b,.stat .num,.crumb b,.donut .dc b,.gv,.wprev h3,.team-card .stats b,.kpi .num{font-family:var(--head);font-weight:800;letter-spacing:-.02em}
em{font-style:italic}
html[dir="rtl"]{--head:"IBM Plex Sans Arabic",sans-serif;--serif:"IBM Plex Sans Arabic",sans-serif;--font:"IBM Plex Sans Arabic",sans-serif}
html[lang="th"]{--head:"Noto Sans Thai",sans-serif;--serif:"Noto Sans Thai",sans-serif;--font:"Noto Sans Thai",sans-serif}
.grain{display:none}

/* ===== Layout — framed white window on lavender ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100svh - 28px);margin:14px;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(32,44,94,.12);overflow:hidden}
/* sidebar */
.side{position:sticky;top:0;height:calc(100svh - 28px);border-inline-end:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.mk{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px var(--glow)}
.mk svg{width:18px;height:18px}
.bname{display:flex;flex-direction:column;line-height:1.1}
.bname b{font-family:var(--head);font-size:18px;font-weight:600;letter-spacing:.01em}
.bname span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
html[dir="rtl"] .bname span{letter-spacing:.04em;font-size:11px}
.navscroll{flex:1;overflow-y:auto;padding:6px 12px 20px;scrollbar-width:thin}
.navscroll::-webkit-scrollbar{width:5px}.navscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.ngroup{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:16px 12px 7px;font-weight:600}
html[dir="rtl"] .ngroup{letter-spacing:.03em;font-size:11.5px}
.nlink{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--muted);font-size:13.5px;font-weight:500;transition:.18s;position:relative;width:100%;text-align:start}
.nlink svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nlink:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--text)}
.nlink.on{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px var(--glow)}
.nlink .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--bad-bg);color:var(--bad);padding:1px 8px;border-radius:99px}
.nlink.on .cnt{background:rgba(255,255,255,.25);color:var(--on-accent)}
[data-theme="dark"] .nlink.on .cnt{background:rgba(0,0,0,.18)}
.side-foot{padding:14px;border-top:1px solid var(--line)}
.plan{border:1px solid var(--glass-brd);border-radius:14px;padding:13px 14px;background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:7px}
.plan b{font-family:var(--head);font-size:15px}
.plan .meter{height:5px;border-radius:9px;background:var(--line2);overflow:hidden}
.plan .meter i{display:block;height:100%;width:62%;background:var(--accent);border-radius:9px}
.plan small{font-size:11px;color:var(--muted)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--glass2);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border-bottom:1px solid var(--glass-brd)}
.crumb{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.crumb small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
html[dir="rtl"] .crumb small{letter-spacing:.02em;font-size:12px}
.crumb b{font-family:var(--head);font-size:21px;font-weight:600}
.search{margin-inline-start:auto;display:flex;align-items:center;gap:9px;height:42px;padding:0 15px;border-radius:10px;border:1px solid var(--glass-brd);background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--muted);min-width:210px;max-width:300px;flex:1}
.search svg{width:16px;height:16px;flex:none}
.search input{border:0;background:none;outline:none;color:var(--text);font-size:13.5px;width:100%}
.search input::placeholder{color:var(--muted)}
.iconbtn{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--glass-brd);background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;color:var(--muted);transition:.2s;position:relative}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.iconbtn .dot{position:absolute;top:9px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.seg{display:flex;border:1px solid var(--glass-brd);border-radius:10px;overflow:hidden;background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{padding:0 13px;height:42px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.me{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:10px;border:1px solid var(--glass-brd);background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,var(--tint3),var(--accent));color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me small{font-size:12px;line-height:1.1}.me small b{display:block;font-family:var(--font);font-weight:600;font-size:13px}
.me .mrole{color:var(--muted)}
.burger{display:none}

.view{padding:26px;max-width:1260px;width:100%}
.page{display:none;animation:fade .4s ease both}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== Reusable ===== */
.ey{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:12px}
.ey::before{content:"";width:20px;height:1px;background:currentColor}
html[dir="rtl"] .ey{letter-spacing:.02em;font-size:12.5px}
.card{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:20px;box-shadow:0 1px 2px rgba(32,44,94,.04),0 6px 20px rgba(32,44,94,.05)}
.card.arch{border-radius:var(--rp)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.card-h h3{font-size:17px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:1px}
.card-h .act{margin-inline-start:auto;display:flex;gap:8px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.col-2{grid-template-columns:1.6fr 1fr}.col-2b{grid-template-columns:1fr 1.6fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-a:hover{transform:translateY(-1px);box-shadow:0 10px 24px var(--glow)}
.btn-o{border:1px solid var(--glass-brd);background:var(--glass2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn-o:hover{border-color:var(--accent)}
.btn-sm{height:33px;padding:0 13px;font-size:12px}
.btn-gh{color:var(--muted);padding:0 10px;height:33px}.btn-gh:hover{color:var(--accent)}

/* stat tiles */
.stat{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border:1px solid var(--glass-brd);border-radius:var(--radius);padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(32,44,94,.04),0 6px 20px rgba(32,44,94,.05)}
.stat::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:var(--rp);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.stat .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.stat .lab svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.7}
.stat .num{font-family:var(--head);font-size:30px;font-weight:600;margin-top:9px;letter-spacing:-.01em;position:relative;z-index:1}
.stat .num small{font-size:14px;color:var(--muted);font-family:var(--font);font-weight:500}
.stat .chg{font-size:11.5px;margin-top:5px;font-weight:600;position:relative;z-index:1}
.chg.up{color:var(--ok)}.chg.dn{color:var(--bad)}

/* pills / badges */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--glass2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--muted);border:1px solid var(--glass-brd)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.pill.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink);border-color:transparent}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--line)}
html[dir="rtl"] .tbl th{letter-spacing:0;font-size:12px}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
html[lang="th"] .tbl td,html[lang="th"] .ev,html[lang="th"] .cal{word-break:keep-all;line-break:normal}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tname{display:flex;align-items:center;gap:10px}
.tav{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--on-accent)}
.muted{color:var(--muted)}
.num-c{font-variant-numeric:tabular-nums}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif}

/* calendar */
.cal{display:grid;grid-template-columns:62px repeat(4,1fr);border:1px solid var(--glass-brd);border-radius:var(--radius);overflow:hidden;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:inset 0 1px 0 var(--hl)}
.cal .ch{padding:12px 10px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:center;background:color-mix(in srgb,var(--surface) 30%,transparent)}
.cal .ch .r{font-size:10.5px;color:var(--muted);font-weight:500}
.cal .ct{border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);font-size:11px;color:var(--muted);padding:8px 8px 0;text-align:center;min-height:64px}
.cal .cc{border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);padding:5px;min-height:64px;position:relative}
.cal .cc:nth-child(5n+1){border-inline-end:0}
.ev{border-radius:10px;padding:7px 9px;font-size:11.5px;line-height:1.3;color:var(--on-accent);margin-bottom:4px;cursor:pointer;border-inline-start:3px solid rgba(255,255,255,.5)}
.ev b{font-weight:600;display:block}
.ev .svc{opacity:.85;font-size:10.5px}
.ev.e1{background:var(--blue)}.ev.e2{background:var(--green)}.ev.e3{background:var(--amber);color:#5a4410}.ev.e4{background:var(--orange)}
.ev.walk{background:var(--surface2);color:var(--text);border:1px dashed var(--line2);border-inline-start:3px dashed var(--accent)}
.ev.block{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);color:var(--muted);border:1px solid var(--line2)}

/* list rows (automations, messages, activity) */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ricon{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.ricon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.rbody{min-width:0;flex:1}
.rbody b{font-weight:600;font-size:13.5px}
.rbody p{font-size:12.5px;color:var(--muted);margin-top:1px}
.rtime{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.rtoggle{width:40px;height:23px;border-radius:999px;background:var(--accent);position:relative;flex:none}
.rtoggle::after{content:"";position:absolute;top:2.5px;inset-inline-start:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
html[dir="rtl"] .rtoggle::after{inset-inline-start:auto;inset-inline-end:2.5px}
.rtoggle.off{background:var(--line2)}.rtoggle.off::after{inset-inline-start:19px}
html[dir="rtl"] .rtoggle.off::after{inset-inline-start:auto;inset-inline-end:19px}

/* message / chat bubbles */
.chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding:4px}
.bub{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4}
.bub.them{background:var(--surface2);border:1px solid var(--line);border-end-start-radius:4px;align-self:flex-start}
.bub.us{background:var(--accent);color:var(--on-accent);border-end-end-radius:4px;align-self:flex-end}
.bub .t{font-size:10px;opacity:.7;margin-top:4px}
.q-item{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);margin-bottom:11px}
.q-item .qi{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:#25D366;color:#fff}
.q-item .qi svg{width:20px;height:20px;fill:currentColor}
.q-item .qb{flex:1;min-width:0}
.q-item .qb .hd{display:flex;gap:8px;align-items:center;font-size:12.5px}
.q-item .qb .msg{font-size:12.5px;color:var(--muted);margin-top:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}

/* progress bar */
.bar{height:8px;border-radius:9px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.bar.g i{background:var(--ok)}.bar.w i{background:var(--warn)}

/* mini bar chart */
.barchart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.barchart .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.barchart .bc i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(var(--accent),var(--tint3));transition:.3s}
.barchart .bc span{font-size:10.5px;color:var(--muted)}
.barchart .bc.hi i{background:linear-gradient(var(--accent-ink),var(--accent))}

/* donut */
.donut{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.donut::before{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--surface)}
.donut .dc{position:relative;text-align:center}
.donut .dc b{font-family:var(--head);font-size:22px;display:block}
.donut .dc small{font-size:10px;color:var(--muted)}

.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.legend .lg{display:flex;align-items:center;gap:9px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lv{margin-inline-start:auto;font-weight:600;font-variant-numeric:tabular-nums}

.fieldrow{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fieldrow label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--glass-brd);background:var(--glass2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);font:inherit;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--accent)}

.gift{aspect-ratio:1.58;border-radius:16px;background:linear-gradient(145deg,var(--accent),var(--tint3));color:var(--on-accent);padding:18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 44px var(--glow);position:relative;overflow:hidden}
.gift::after{content:"";position:absolute;inset-inline-end:-26px;bottom:-26px;width:110px;height:110px;border-radius:var(--rp);border:1.5px solid rgba(255,255,255,.3)}
.gift .gv{font-family:var(--head);font-size:26px;font-weight:600}

.note{display:flex;gap:11px;padding:13px 15px;border-radius:13px;background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 24%,transparent);font-size:12.5px;color:var(--text)}
.note svg{width:18px;height:18px;flex:none;stroke:var(--info);fill:none;stroke-width:1.8;margin-top:1px}
.note.acc{background:color-mix(in srgb,var(--accent) 9%,transparent);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.note.acc svg{stroke:var(--accent)}

.hairline{height:1px;background:var(--line);margin:18px 0}
.coming{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px dashed var(--line2);border-radius:13px;font-size:13px}
.coming .ci{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.coming .ci svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.coming .pill{margin-inline-start:auto}

.team-card{text-align:center;padding:22px 18px}
.team-card .tav{width:62px;height:62px;margin:0 auto 12px;font-size:20px}
